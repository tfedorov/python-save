[project]
name = "python-save"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0", # REST API framework: routing, validation, dependency injection, OpenAPI
    "python-multipart>=0.0.32", # Parses HTML forms (multipart/form-data), including file uploads
    "requests>=2.34.2", # HTTP client: sends GET, POST, PUT, DELETE requests to REST APIs
    "uvicorn>=0.54.0", # ASGI server: runs FastAPI and handles HTTP connections
]

[dependency-groups]
dev = [
    "pytest>=9.2.0", # Testing framework: test discovery, fixtures, assertions, parametrization
]

[[tool.uv.index]]
url = "https://pypi.apple.com/simple"
default = true
